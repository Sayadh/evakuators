# Local/CI services for live dispatch development and tests — NOT for production.
#
#   docker compose -f docker-compose.dev.yml up -d
#   export LIVE_DISPATCH_TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:55432/postgres
#   export LIVE_DISPATCH_TEST_REDIS_URL=redis://127.0.0.1:56379
#   (cd backend && npm run test:live)
#
# Ports are deliberately NOT 5432/6379 so this never collides with a developer's
# own Postgres/Redis — and never with the reserved app ports 3002/4002/3003/4003.
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    command: ["postgres", "-c", "max_connections=200", "-c", "timezone=Asia/Yerevan"]
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
