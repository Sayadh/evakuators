# Evakuators.am — example nginx configuration
#
#   evakuators.am      → Nuxt frontend  (PM2, port 3002)
#   api.evakuators.am  → NestJS backend (PM2, port 4002, routes under /api/v1)
#
# Never swap these two ports — 3002 is always the frontend, 4002 always the backend.
#
# TLS certificates: use certbot (Let's Encrypt):
#   certbot --nginx -d evakuators.am -d www.evakuators.am -d api.evakuators.am

# ── Resized-photo cache ───────────────────────────────────
#
# `/_ipx/...` is Nuxt resizing a photo on the fly (sharp, CPU-heavy). Without a
# cache every visitor's browser made the server re-download the original and
# re-encode it — which is exactly how the Supabase egress quota ran out and
# every photo on the site went to HTTP 402. Photos are immutable (one UUID per
# upload, never overwritten), so a variant computed once is valid forever; this
# zone keeps up to 2 GB of them and evicts what nobody asked for in 60 days.
#
# proxy_cache_path must be at http{} level — a file in sites-enabled/ is
# included there, so it goes here, outside every server{} block. Create the
# directory once: sudo mkdir -p /var/cache/nginx/evakuators-ipx
proxy_cache_path /var/cache/nginx/evakuators-ipx levels=1:2 keys_zone=evakuators_ipx:20m
                 max_size=2g inactive=60d use_temp_path=off;

# ── Canonical host redirect ───────────────────────────────
#
# Exactly one address is canonical: https://evakuators.am — HTTPS, no www.
# Everything else 301s to it, so a page is never reachable at two URLs that a
# crawler could treat as duplicates (and so the canonical tags the app emits
# describe the address visitors are actually on).
#
# Three non-canonical forms exist and all three are handled here:
#   http://evakuators.am       → https://evakuators.am
#   http://www.evakuators.am   → https://evakuators.am
#   https://www.evakuators.am  → https://evakuators.am   (block below)
#
# This whole server block matches port 80 only, so it cannot 301 an already-
# HTTPS request and cannot loop. Only the www→apex rule used to be here, which
# left plain http://evakuators.am/ being served over HTTP indefinitely —
# reachable, indexable, and a second address for every page on the site.
server {
    listen 80;
    listen [::]:80;
    server_name evakuators.am www.evakuators.am;

    # Certbot writes its challenge files here and must be answered over HTTP,
    # so it is excluded from the redirect — otherwise renewals fail once this
    # block starts redirecting everything.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://evakuators.am$request_uri;
    }
}

# ── https://www → https://apex ────────────────────────────
#
# Needs its own block: the one above only listens on 80. Certbot issues the
# certificate for both names (see the command at the top), so www can be served
# over TLS — it just should not answer with content.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.evakuators.am;

    # ssl_certificate / ssl_certificate_key are added here by certbot.

    return 301 https://evakuators.am$request_uri;
}

# ── Frontend ──────────────────────────────────────────────
#
# The only block that serves content, and it is HTTPS-only. Port 80 is handled
# entirely by the redirect block above — listening here too would be a
# duplicate `server_name` on the same port, which nginx resolves by silently
# ignoring one of them.
#
# `certbot --nginx` fills in ssl_certificate / ssl_certificate_key. Until it has
# run once, nothing answers on 443 and the redirect above has nowhere to send
# traffic — so run certbot before switching DNS over.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name evakuators.am;

    # ssl_certificate / ssl_certificate_key are added here by certbot.

    # Moderation panel — auth is handled by the app itself now (JWT login,
    # see backend/src/admin-auth). No nginx Basic Auth here on purpose: it
    # only ever gated the page shell, not the data, and it broke cross-origin
    # fetch() preflight for no real security benefit. This location block only
    # exists in case you want to add IP allow-listing later.
    location /admin {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Tow truck photos ──────────────────────────────────
    #
    # Served straight from disk — Node never sees these. The directory is the
    # backend's MEDIA_DIR and the URL prefix its MEDIA_PUBLIC_URL; the three
    # must agree (docs/deployment.md § "Image storage").
    #
    # Only `*.webp` is served: every upload is re-encoded to WebP by the
    # backend, so anything else under /media/ (a stray temp file, a dotfile) is
    # not a photo and 404s by the plain prefix block below. The regex location
    # wins over that prefix by nginx's matching order.
    location ~ ^/media/([A-Za-z0-9/_-]+\.webp)$ {
        alias /var/www/evakuators-media/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    location /media/ {
        return 404;
    }

    # Resized variants of the photos above — see proxy_cache_path at the top.
    # The 200 lifetime is a ceiling; IPX copies the original's one-year
    # Cache-Control onto its response, and that is what browsers keep.
    location /_ipx/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache evakuators_ipx;
        proxy_cache_valid 200 60d;
        proxy_cache_valid 404 1m;
        # Twenty visitors opening the same new listing at once cost one resize
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        # A cookie must never make a public image uncacheable, nor be replayed
        # from the cache to another visitor
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Long cache for Nuxt build assets
    location /_nuxt/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}

# ── Backend API ───────────────────────────────────────────
server {
    listen 80;
    server_name api.evakuators.am;

    # Image uploads go through the API
    client_max_body_size 35m;

    # Moderation endpoints — auth is a real backend JWT now (DriverJwtGuard's
    # sibling AdminJwtGuard, see backend/src/admin-auth), checked by NestJS on
    # every request. No nginx Basic Auth: it doesn't survive cross-origin
    # fetch() preflight and added no protection the app-level guard doesn't
    # already provide. This location only exists for future IP allow-listing.
    location /api/v1/admin {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
