# Evakuators.am — STAGING nginx configuration
#
#   staging.evakuators.am      → Nuxt frontend  (PM2, port 3003)
#   staging-api.evakuators.am  → NestJS backend (PM2, port 4003, routes under /api/v1)
#
# Ports are reserved exactly like production's — see the root CLAUDE.md's "one
# rule that breaks everything" for why this matters. Staging's pair is 3003 /
# 4003, one above production's 3002 / 4002. Never let staging and production
# share a port, and never point staging's nginx blocks at 3002/4002 "just to
# test something quickly" — that would proxy staging traffic into the real
# backend and database.
#
# This is a copy of evakuators.am.conf with the hostnames and ports changed —
# see that file for the reasoning behind each header/location choice, not
# repeated here. Deliberately identical shape: the whole point of staging is
# that it behaves like production, and a differently-structured nginx config
# would undermine that from the start.
#
# TLS certificates: use certbot (Let's Encrypt), same as production:
#   certbot --nginx -d staging.evakuators.am -d staging-api.evakuators.am
#
# See docs/deployment.md § "Staging environment" for the full setup (PM2
# config, database, .env, and the Telegram/Supabase caveats — staging shares
# production's bot and Storage bucket by deliberate choice, it does not get
# its own).

# ── Frontend ──────────────────────────────────────────────
server {
    listen 80;
    server_name staging.evakuators.am;

    location /admin {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_nuxt/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The whole staging site must never be indexed — unlike production, where
    # individual pages opt into noindex one at a time (useSeoMetaData's
    # `noindex` option — /admin, /login, /dashboard, and a driverless
    # settlement landing page). A per-page tag would mean remembering to add
    # it to every future page; this one header covers all of them, including
    # pages that don't render HTML at all (the header applies regardless).
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}

# ── Backend API ───────────────────────────────────────────
server {
    listen 80;
    server_name staging-api.evakuators.am;

    client_max_body_size 35m;

    location /api/v1/admin {
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
